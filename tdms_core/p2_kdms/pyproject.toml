[project]
name = "p2_kdms"
version = "0.1.0"
description = "KR Data Management System"
dependencies = [
    "fastapi>=0.121.0",
    "pydantic-settings",
    "psycopg2-binary==2.9.12",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["p2_kdms*"]
