[project]
name = "p3_usdms"
version = "0.1.0"
description = "US Data Management System"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic-settings",
    "psycopg2-binary>=2.9.9",
    "requests>=2.31.0",
    "yfinance>=0.2.38",
    "pandas>=2.2.0",
    "aiohttp>=3.9.0",
]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["p3_usdms*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "integration: marks tests as integration (requires real DB container)",
]
