events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;

        # Docker DNS 리졸버 지정 (기동 시 체크 방지)
        resolver 127.0.0.11 valid=10s;

        # 1. KDMS 백엔드 라우팅 (p2)
        location /api/kr/ {
            set $upstream_kdms p2_kdms;
            rewrite ^/api/kr/(.*)$ /api/$1 break;
            proxy_pass http://$upstream_kdms:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. USDMS 백엔드 라우팅 (p3)
        location /api/us/ {
            set $upstream_usdms p3_usdms;
            rewrite ^/api/us/(.*)$ /api/$1 break;
            proxy_pass http://$upstream_usdms:8005;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Manager 백엔드 라우팅 (p4)
        location /api/mgr/ {
            set $upstream_p4 p4_backend;
            rewrite ^/api/mgr/(.*)$ /api/mgr/$1 break;
            proxy_pass http://$upstream_p4:8010;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 4. WebSocket 로그 중계 (KR)
        location /ws/logs/kr {
            set $upstream_p4 p4_backend;
            proxy_pass http://$upstream_p4:8010/api/mgr/ws/logs/kr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. WebSocket 로그 중계 (US)
        location /ws/logs/us {
            set $upstream_p4 p4_backend;
            proxy_pass http://$upstream_p4:8010/api/mgr/ws/logs/us;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # 5. 프론트엔드 SPA 정적 서빙 및 라우팅 fallback
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }
}
