[project]
name = "p3_usdms"
version = "0.1.0"
description = "US Data Management System"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic-settings",
    "psycopg2-binary>=2.9.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["p3_usdms*"]
