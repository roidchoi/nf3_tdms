services:
  # 1. KDMS 데이터베이스 (TimescaleDB HA - PG16)
  kdms_db:
    image: timescale/timescaledb-ha:pg16
    container_name: kdms_timescaledb
    restart: always
    shm_size: '512mb'
    environment:
      POSTGRES_USER: ${DEV_KDMS_DB_USER:-roid}
      POSTGRES_PASSWORD: ${DEV_KDMS_DB_PASSWORD:-password}
      POSTGRES_DB: ${DEV_KDMS_DB_NAME:-kdms_db}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./data/kdms_db:/var/lib/postgresql/data
      - ./tdms_core/p1_shared/p1_shared/db/kdms_origin:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      tdms-net:
        ipv4_address: 172.20.0.3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-roid} -d $${POSTGRES_DB:-kdms_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 15
        rm -f /var/lib/postgresql/data/postmaster.pid
        (
          sleep 30
          until pg_isready -h localhost -p 5432 -d template1; do sleep 2; done
          psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c "SELECT 1 FROM stock_info LIMIT 1;" > /dev/null 2>&1
          if [ $$? -ne 0 ]; then
            echo "❌ [KDMS DB 검증 실패] 물리 데이터 마운트 유실 또는 테이블 미존재 감지! 컨테이너를 중지합니다."
            kill -3 1
          else
            echo "✅ [KDMS DB 검증 통과] 물리 데이터 마운트 정합성 확보 완료."
          fi
        ) &
        exec docker-entrypoint.sh postgres -c max_locks_per_transaction=256

  # 2. USDMS 데이터베이스 (TimescaleDB - PG16)
  usdms_db:
    image: timescale/timescaledb@sha256:9e9f50161784dc57d3f547b89ded4af73553f9acb4677345ed05f45af7c7f664
    container_name: usdms_timescaledb
    restart: always
    shm_size: '512mb'
    environment:
      POSTGRES_USER: ${DEV_USDMS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DEV_USDMS_DB_PASSWORD:-password}
      POSTGRES_DB: ${DEV_USDMS_DB_NAME:-usdms_db}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./data/usdms_db:/var/lib/postgresql/data
      - ./tdms_core/p1_shared/p1_shared/db/usdms_origin:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      tdms-net:
        ipv4_address: 172.20.0.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-usdms_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 15
        rm -f /var/lib/postgresql/data/postmaster.pid
        (
          sleep 30
          until pg_isready -h localhost -p 5432 -d template1; do sleep 2; done
          psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c "SELECT 1 FROM us_ticker_master LIMIT 1;" > /dev/null 2>&1
          if [ $$? -ne 0 ]; then
            echo "❌ [USDMS DB 검증 실패] 물리 데이터 마운트 유실 또는 테이블 미존재 감지! 컨테이너를 중지합니다."
            kill -3 1
          else
            echo "✅ [USDMS DB 검증 통과] 물리 데이터 마운트 정합성 확보 완료."
          fi
        ) &
        exec docker-entrypoint.sh postgres -c max_locks_per_transaction=256

  # 3. KDMS 한국 주식 백엔드 API
  p2_kdms:
    build:
      context: ./
      dockerfile: tdms_core/p2_kdms/backend.Dockerfile
    container_name: p2_kdms
    restart: always
    depends_on:
      kdms_db:
        condition: service_healthy
    environment:
      - TDMS_ENV=${TDMS_ENV:-dev}
    volumes:
      - ./backups:/app/backups
      - ./.env:/app/.env
    networks:
      tdms-net:
        ipv4_address: 172.20.0.5

  # 4. USDMS 미국 주식 백엔드 API
  p3_usdms:
    build:
      context: ./
      dockerfile: tdms_core/p3_usdms/backend.Dockerfile
    container_name: p3_usdms
    restart: always
    depends_on:
      usdms_db:
        condition: service_healthy
    environment:
      - TDMS_ENV=${TDMS_ENV:-dev}
    volumes:
      - ./backups:/app/backups
      - ./.env:/app/.env
    networks:
      tdms-net:
        ipv4_address: 172.20.0.6

  # 5. P4 통합 관리자 백엔드 API
  p4_backend:
    build:
      context: ./
      dockerfile: tdms_core/p4_manager/backend.Dockerfile
    container_name: p4_backend
    restart: always
    depends_on:
      p2_kdms:
        condition: service_started
      p3_usdms:
        condition: service_started
    environment:
      - TDMS_ENV=${TDMS_ENV:-dev}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./backups:/app/backups
      - ./.env:/app/.env
      - ~/.ssh:/root/.ssh:ro
    networks:
      tdms-net:
        ipv4_address: 172.20.0.7

  # 6. P4 통합 관리자 Nginx 프론트엔드 (80 포트 노출)
  p4_frontend:
    build:
      context: ./
      dockerfile: tdms_core/p4_manager/frontend.Dockerfile
    container_name: p4_frontend
    ports:
      - "80:80"
    depends_on:
      p4_backend:
        condition: service_started
    networks:
      tdms-net:
        ipv4_address: 172.20.0.8
    restart: always

networks:
  tdms-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
